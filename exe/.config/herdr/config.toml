# herdr config on exe.dev VMs -- remote agent workspace, one of the machines in the
# Mac's herdr window. Added there with: herdr machine add <vm>.exe.xyz --label <vm>

onboarding = false

[theme]
# Inherit the attaching terminal palette.
name = "terminal"

[terminal]
# New splits/tabs/workspaces open in the focused pane's cwd, as on the Mac.
new_cwd = "follow"

[ui]
mouse_capture = true
copy_on_select = true
# One tab per space is the norm here, so the tab bar is pure chrome; it
# reappears as soon as a space gets a second tab.
hide_tab_bar_when_single_tab = true
# herdr renders the window title on the server, so every host carries the same
# line and the Ghostty window reads the same whichever machine it shows.
window_title = "herdr {hostname}: {workspace}"

[ui.toast]
# Headless remote server: toasts render in the attached herdr UI (on the Mac),
# matching the Mac config; the VM has no desktop notifier.
delivery = "herdr"

[ui.toast.herdr]
position = "top-right"

[session]
# Reconnect agent panes to their native sessions after a server restart.
resume_agents_on_restore = true

[keys]
# Same tmux-shaped map as the Mac: spaces = tmux windows; tabs use shift.
# Native keys are client-local; custom commands run on the selected server.
prefix = "ctrl+b"
detach = "prefix+d"
help = "prefix+?"
settings = "prefix+shift+s"
reload_config = "prefix+shift+r"
toggle_sidebar = "prefix+b"
open_notification_target = "prefix+o"
goto = "prefix+s"
new_workspace = "prefix+c"
rename_workspace = "prefix+,"
close_workspace = "prefix+&"
next_workspace = ["prefix+n", "prefix+ctrl+j"]
previous_workspace = ["prefix+p", "prefix+ctrl+k"]
workspace_picker = "prefix+w"
switch_workspace = "prefix+1..9"
focus_agent = ["prefix+alt+1..9", "alt+1..9"]
next_agent = ["prefix+enter", "alt+j"]
previous_agent = "alt+k"
new_worktree = ""
new_tab = "prefix+shift+c"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"
next_tab = ["prefix+shift+right", "prefix+alt+l", "prefix+ctrl+n"]
previous_tab = ["prefix+shift+left", "prefix+alt+h", "prefix+ctrl+p"]
switch_tab = ""
rename_pane = "prefix+shift+p"
split_vertical = 'prefix+"'
split_horizontal = "prefix+%"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = ["prefix+ctrl+o", "prefix+ctrl+l"]
cycle_pane_previous = ["prefix+shift+tab", "prefix+ctrl+h"]
last_pane = "prefix+;"
close_pane = "prefix+x"
zoom = "prefix+z"
copy_mode = "prefix+["
edit_scrollback = "prefix+e"
resize_mode = "prefix+r"
# Use prefix+r resize mode; Ctrl-h/j/k/l now navigate.
resize_pane_left = ""
resize_pane_down = ""
resize_pane_up = ""
resize_pane_right = ""
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = '"$HOME/.local/bin/herdr-space-picker"'
description = "fuzzy-find space / tab (this server)"
width = "80%"
height = "60%"

# Search destinations, API commands, plugin actions and native shortcut hints.
[[keys.command]]
key = "prefix+space"
type = "popup"
command = '"$HOME/.local/bin/herdr-space-picker" everything'
description = "everything command palette (this server)"
width = "90%"
height = "80%"

# New worktree in <project>/.worktrees/, as a grouped child space running pi:
# the popup asks for a branch (shell/.local/bin/worktree), as on the Mac.
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = '"$HOME/.local/bin/worktree" popup'
description = "new worktree (<project>/.worktrees)"
height = 12
