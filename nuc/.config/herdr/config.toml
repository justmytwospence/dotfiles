# herdr config on nuc -- remote agent workspace for ~/homelab
# Attach from the Mac with: herdr --remote nuc --session homelab

onboarding = false

[theme]
# Inherit the attaching terminal palette.
name = "terminal"

[terminal]
# New panes/tabs/workspaces default into the homelab repo.
new_cwd = "~/homelab"

[ui]
mouse_capture = true
copy_on_select = true
# herdr renders the window title on the server: the Mac's attention notifier
# finds the herdr client's Ghostty terminal by this "herdr " prefix, whichever
# machine it shows.
window_title = "herdr {hostname}: {workspace}"

[ui.toast]
# Headless remote server: render toasts in the attached herdr UI (on the Mac),
# not a desktop notifier on the NUC (there is none).
delivery = "herdr"

[session]
# Reconnect agent panes to their native sessions after a server restart.
resume_agents_on_restore = true

[keys]
# Same tmux-shaped map as the Mac: spaces = tmux windows; tabs use shift.
# Native keys are client-local; custom commands run on the selected server.
prefix = "ctrl+b"
detach = "prefix+d"
help = "prefix+?"
settings = "prefix+shift+s"
reload_config = "prefix+shift+r"
toggle_sidebar = "prefix+b"
open_notification_target = "prefix+o"
goto = "prefix+s"
new_workspace = "prefix+c"
rename_workspace = "prefix+,"
close_workspace = "prefix+&"
next_workspace = "prefix+n"
previous_workspace = "prefix+p"
workspace_picker = "prefix+w"
switch_workspace = "prefix+1..9"
focus_agent = "prefix+alt+1..9"
new_worktree = ""
new_tab = "prefix+shift+c"
rename_tab = "prefix+shift+t"
close_tab = "prefix+shift+x"
next_tab = "prefix+shift+right"
previous_tab = "prefix+shift+left"
switch_tab = ""
rename_pane = "prefix+shift+p"
split_vertical = 'prefix+"'
split_horizontal = "prefix+%"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+ctrl+o"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+;"
close_pane = "prefix+x"
zoom = "prefix+z"
copy_mode = "prefix+["
edit_scrollback = "prefix+e"
resize_mode = "prefix+r"
resize_pane_left = "prefix+ctrl+h"
resize_pane_down = "prefix+ctrl+j"
resize_pane_up = "prefix+ctrl+k"
resize_pane_right = "prefix+ctrl+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = '"$HOME/.local/bin/herdr-space-picker"'
description = "fuzzy-find space / tab (this server)"
width = "80%"
height = "60%"

# Search destinations, API commands, plugin actions and native shortcut hints.
[[keys.command]]
key = "prefix+space"
type = "popup"
command = '"$HOME/.local/bin/herdr-space-picker" everything'
description = "everything command palette (this server)"
width = "90%"
height = "80%"

# Ctrl-n/p traverse actionable agents; selected server/session only.
[[keys.command]]
key = "prefix+ctrl+n"
type = "plugin_action"
command = "attention-queue.next-attention"
description = "attention: next actionable agent (this server)"

[[keys.command]]
key = "prefix+ctrl+p"
type = "plugin_action"
command = "attention-queue.previous-attention"
description = "attention: previous actionable agent (this server)"

# herdr-attention-queue actions (plugins/herdr-attention-queue, linked here too).
# The client dispatches custom keys through the selected machine, so the NUC
# carries the same bindings as the Mac.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "attention-queue.mark-reviewed"
description = "attention: mark agent reviewed"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "attention-queue.mark-all-reviewed"
description = "attention: mark all agents reviewed"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "attention-queue.mark-unread"
description = "attention: mark agent done"

# New worktree in <project>/.worktrees/, as a grouped child space running pi:
# the popup asks for a branch (shell/.local/bin/worktree), as on the Mac.
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = '"$HOME/.local/bin/worktree" popup'
description = "new worktree (<project>/.worktrees)"
height = 12
