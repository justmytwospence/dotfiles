# Hold back freshly-published packages for a week: a compromised or broken
# release is usually caught and yanked well inside that window.
exclude-newer = "7 days"

# Hardlink wheels from the cache into each venv instead of copying them. The
# cache and every project live on the same APFS volume, so this is safe, and it
# stops packages like torch being written out in full for every environment.
link-mode = "hardlink"

# No [exclude-newer-package] here. uv merges user-level settings into every
# project's uv.lock [options], so an exemption here makes CI (which has no such
# file) fail `uv sync --locked`. The packages I maintain (.chezmoidata/cooldown.json
# cooldownExempt.uv) are exempted per uv tool, in its receipt (converge uv-tools),
# and per project, in that project's pyproject.toml (docs/cooldown.md).
