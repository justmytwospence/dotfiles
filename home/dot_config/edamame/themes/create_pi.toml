# Pi's theme for edamame. pi-plan-mode rewrites this file from the current Pi theme each time Pi
# opens edamame (chezmoi creates it only when missing, so edamame has a theme before then).
# Real colours throughout: edamame tints code and quotes by blending toward `bg`, which does
# nothing on named colours or `reset`.
light = false
task_strikethrough = true

[palette]
text = "#e6edf3"
text_muted = "#9198a1"
bg = "#1e1e1e"
bg_muted = "#262626"
surface = "#333333"
surface_elevated = "#2b2b2b"
primary = "#79c0ff"
secondary = "#6e7681"
accent = "#d2a8ff"
link = "#58a6ff"
success = "#3fb950"
warning = "#d29922"
error = "#f85149"
code = "#ffa657"
diff_add = "#3fb950"
diff_delete = "#f85149"
