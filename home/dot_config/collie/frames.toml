# Collie (fork build with frames.toml support): how this machine's pi extensions draw the
# editor, so Collie's phone app finds the editor and lifts questions. pi-status-footer paints a
# context gauge into the rules in ━ and draws an indented footer, pi-vim puts its mode label at
# the bottom rule's end, and pi-bg's widget row and a blank row can stand under the editor.
# Collie reads this once at startup: run `collie restart` after a change.
[pi]
rule_glyphs = "━"
rule_labels = "ends"
status_rows = 12
status_indent = 1
status_blank_rows = 1
