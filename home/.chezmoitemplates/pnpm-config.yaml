# pnpm's global config (managed by chezmoi: edit .chezmoitemplates/pnpm-config.yaml in the
# dotfiles source, not this file). Registry tokens belong in auth.ini next to it
# (`pnpm config set` writes them there), not here.
#
# Release cooldown (docs/cooldown.md): a version installs only once it is a week old, for
# every dependency including transitive ones and the entries of an existing lockfile.
# Setting it explicitly also makes it strict: no fallback to a fresher version.
minimumReleaseAge: 10080
# Standing exemptions (.chezmoidata/cooldown.json cooldownExempt.npm). A project allows one
# requested release with `<pkg>@<version>` in its own pnpm-workspace.yaml.
minimumReleaseAgeExclude:
{{- range .cooldownExempt.npm }}
  - {{ . | squote }}
{{- end }}
# Fail instead of skipping the check when a registry cannot date a release.
minimumReleaseAgeIgnoreMissingTime: false
